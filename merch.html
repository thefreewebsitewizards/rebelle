<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REBELLE - Merch Store</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }
        
        .merch-store-fullscreen {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        .merch-store-fullscreen iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        .floating-exit-btn {
            position: fixed;
            top: 90%;
            right: 30px;
            background: linear-gradient(45deg, #FF1493, #8B008B);
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 20, 147, 0.4);
            transition: all 0.3s ease;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .floating-exit-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 20, 147, 0.6);
            background: linear-gradient(45deg, #8B008B, #FF1493);
        }
        
        .floating-exit-btn:active {
            transform: scale(0.95);
        }
        
        /* Mobile responsive */
        @media (max-width: 768px) {
            .floating-exit-btn {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
                top: 15px;
                right: 15px;
            }
        }
        
        @media (max-width: 480px) {
            .floating-exit-btn {
                width: 45px;
                height: 45px;
                font-size: 1rem;
                top: 90%;
                right: 10px;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&display=swap" rel="stylesheet">
    <style>
        .exit-btn {
            font-family: 'Bowlby One', "Roboto", sans-serif;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Floating Exit Button -->
    <button class="floating-exit-btn" onclick="window.location.href='index.html'" title="Back to Home">
        <i class="fas fa-times"></i>
    </button>
    
    <!-- Full Screen Merch Store -->
    <div class="merch-store-fullscreen">
        <iframe src="https://rebelle-artist-store.printify.me/" allowfullscreen></iframe>
    </div>
    
    <script>
        // Optional: Add keyboard shortcut to exit (ESC key)
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                window.location.href = 'index.html';
            }
        });
        
        // Optional: Add loading indicator
        const iframe = document.querySelector('iframe');
        iframe.addEventListener('load', function() {
            console.log('Merch store loaded successfully');
        });
    </script>
</body>
</html>
