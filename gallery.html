    <style>
        /* Gallery-specific styles */
        .gallery-hero {
            margin-top: 50px;
            padding: 3rem 0 1rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.8);
            color: #8b008b;
        }
        
        .gallery-hero h1 {
            font-family: 'Chivo', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        
        .gallery-section {
            padding: 60px 0;
            background: #f8f8f8;
        }
        
        .gallery-section:nth-child(even) {
            background: #B64D6B;
        }
        
        .section-title {
            font-family: 'Chivo', sans-serif;
            font-weight: 900;
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 40px;
            color: #1a1a1a;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .image-grid {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            height: 400px;
        }
        
        .main-image {
            flex: 1;
            height: 100%;
        }
        
        .side-images {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
        }
        
        .side-image {
            flex: 1;
            height: calc((100% - 40px) / 3);
        }
        
        .taboo-grid {
            display: block;
            max-width: 600px;
            height: auto;
        }
        
        .gallery-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .gallery-image:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .category-nav {
            padding: 40px 0;
            background: #1a1a1a;
            top: 0;
            z-index: 100;
            font-family: 'Open Sans', "Roboto", sans-serif;
            font-weight: bold;
        }
        
        .category-buttons {
            display: flex;
            gap: 15px;
            padding: 0 90px;
            justify-content: center;
            flex-wrap: wrap;
            font-family: 'Open Sans', "Roboto", sans-serif;
            font-weight: bold;
        }
        
        .category-btn {
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            font-family: 'Open Sans', "Roboto", sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .category-btn:hover, .category-btn.active {
            background: #fff;
            color: #1a1a1a;
        }
        
        .filtered-gallery {
            padding: 60px 0;
            background: white;
        }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .view-toggle {
            text-align: center;
            margin-top: 40px;
            font-family: 'Open Sans', "Roboto", sans-serif;
            font-weight: bold;
        }
        
        .view-btn {
            background: #1a1a1a;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Open Sans', "Roboto", sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.3s ease;
        }
        
        .view-btn:hover {
            background: #333;
        }

        /* Centralized Lightbox Styles */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .lightbox.active {
            opacity: 1;
            visibility: visible;
        }

        .lightbox-content {
            position: relative;
            max-width: 90%;
            max-height: 80vh;
            overflow: hidden;
        }

        .lightbox-img,
        .lightbox-video {
            max-width: 100%;
            max-height: 80vh;
            display: none;
            border-radius: 8px;
        }

        .lightbox-img.active,
        .lightbox-video.active {
            display: block;
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 30px;
            color: white;
            cursor: pointer;
            z-index: 2001;
            background: none;
            border: none;

        }

        .lightbox-close:hover {
            color: #ccc;
        }

        .lightbox-nav {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
        }

        .lightbox-prev,
        .lightbox-next {
            color: white;
            font-size: 24px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 10px;
        }

        .lightbox-prev:hover,
        .lightbox-next:hover {
            color: #ccc;
        }
        
        /* Full-width container centered */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* New grid layout for TBDD, Eternity, and Break Me sections */
        .image-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr; /* Main image takes 2 columns, others take 1 each */
            gap: 20px;
            margin: 0;
            padding: 0;

        }
        
        /* Standard image styling */
        .image-column {
            height: 100%;
        }
        
        .image-column img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;

        /* Hover effect */
        .image-column img:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .image-row {
        grid-template-columns: 1fr 1fr 1fr; /* Set up a 3-column layout */
        grid-template-rows: 1fr 1fr; /* Make the rows flexible */
        gap: 15px;
    }

    /* Ensure the main image takes the first row */
    .image-column:first-child {
        grid-column: 1 / -1; /* Span across the entire row */
    }

    .image-column:not(:first-child) {
        grid-row: 2;
    }

    /* Make sure side images stack under the main image */
    .side-images-mobile {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
    }
        }

            }
            
            .category-buttons::-webkit-scrollbar {

            }

            }
        }
        
        @media (max-width: 480px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }

    <script>
        // Gallery data structure
        const galleryData = {
            all: [], // Will be populated with all images from other categories
            birthday: [
                'assets/IMG_9726.jpeg', 'assets/IMG_9732.jpeg', 'assets/IMG_9733.jpeg', 
                'assets/IMG_9734.jpeg', 'assets/IMG_9735.jpeg', 'assets/rebelle.jpg'
            ],
            acoustic: [
                'assets/LA (1).jpeg', 'assets/LA (2).jpeg', 'assets/LA (3).jpeg', 'assets/LA (4).jpeg',
                'assets/LA (5).jpeg', 'assets/LA (6).jpeg', 'assets/LA (7).jpeg', 'assets/LA (8).jpeg',
                'assets/LA (9).jpeg', 'assets/LA (10).jpeg', 'assets/LA (11).jpeg', 'assets/LA (12).jpeg'
            ],
            npr: [
                'assets/NPR (1).jpeg', 'assets/NPR (2).jpeg', 'assets/NPR (3).jpeg', 'assets/NPR (4).jpeg',
                'assets/NPR (5).jpeg', 'assets/NPR (6).jpeg', 'assets/NPR (7).jpeg', 'assets/NPR (8).jpeg',
                'assets/NPR (9).jpeg'
            ],
            mint: [
                'assets/mint (1).jpeg', 'assets/mint (2).jpeg', 'assets/mint (3).jpeg', 'assets/mint (4).jpeg'
            ],
            wfnm: [
                'assets/wfnm (1).jpeg', 'assets/wfnm (2).jpeg', 'assets/wfnm (3).jpeg', 'assets/wfnm (4).jpeg',
                'assets/wfnm (5).jpeg'
            ],
            recital: [
                'assets/recital (1).jpeg', 'assets/recital (2).jpeg', 'assets/recital (3).jpeg', 'assets/recital (4).jpeg',
                'assets/recital (5).jpeg', 'assets/recital (6).jpeg', 'assets/recital (7).jpeg', 'assets/recital (8).jpeg',
                'assets/recital (9).jpeg', 'assets/recital (10).jpeg', 'assets/recital (11).jpeg', 'assets/recital (12).jpeg',
                'assets/recital (13).jpeg'
            ],
            performance: [
                'assets/performance (1).jpeg', 'assets/performance (2).jpeg', 'assets/performance (3).jpeg', 'assets/performance (4).jpeg',
                'assets/performance (5).jpeg', 'assets/performance (6).jpeg', 'assets/performance (7).jpeg', 'assets/performance (1).png',
                'assets/performance (2).png', 'assets/performance (3).png', 'assets/performance (4).png'
            ],
            rebelle: [
                'assets/rebellee (1).jpeg', 'assets/rebellee (2).jpeg', 'assets/rebellee (3).jpeg', 'assets/rebellee (4).jpeg',
                'assets/rebellee (5).jpeg', 'assets/rebellee (6).jpeg', 'assets/rebellee (7).jpeg', 'assets/rebellee (8).jpeg',
                'assets/rebellee (9).jpeg', 'assets/rebellee (10).jpeg', 'assets/rebellee (11).jpeg', 'assets/rebellee (12).jpeg',
                'assets/rebellee (13).jpeg', 'assets/rebellee (14).jpeg'
            ]
        };

        // Populate 'all' category with all images from other categories
        Object.keys(galleryData).forEach(category => {
            if (category !== 'all') {
                galleryData.all = galleryData.all.concat(galleryData[category]);
            }
        });

        // Remove duplicates from 'all' category
        galleryData.all = [...new Set(galleryData.all)];

        let currentCategory = 'all';
        let showingAll = false;

        // Initialize gallery
        document.addEventListener('DOMContentLoaded', function() {
            displayImages('all');
            setupCategoryButtons();
        });

        function setupCategoryButtons() {
            const buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(button => {
                button.addEventListener('click', function() {
                    // Remove active class from all buttons
                    buttons.forEach(btn => btn.classList.remove('active'));
                    // Add active class to clicked button
                    this.classList.add('active');
                    
                    const category = this.dataset.category;
                    currentCategory = category;
                    showingAll = false;
                    displayImages(category);
                });
            });
        }

        function displayImages(category) {
            const galleryGrid = document.getElementById('galleryGrid');
            const viewToggleBtn = document.getElementById('viewToggleBtn');
            const images = galleryData[category] || [];
            
            let imagesToShow;
            if (category === 'all') {
                imagesToShow = showingAll ? images : images.slice(0, 8);
                viewToggleBtn.style.display = 'inline-block';
                viewToggleBtn.textContent = showingAll ? 'View Less' : 'View All';
            } else {
                imagesToShow = images;
                viewToggleBtn.style.display = 'none';
            }
            
            galleryGrid.innerHTML = '';
            imagesToShow.forEach(imageSrc => {
                const imageDiv = document.createElement('div');
                imageDiv.innerHTML = `<img src="${imageSrc}" alt="Gallery Image" class="gallery-image"/>`;
                galleryGrid.appendChild(imageDiv);
            });
            
            // Reinitialize lightbox after images are loaded
            setTimeout(() => {
                initLightbox();
            }, 100);
        }

        function toggleView() {
            if (currentCategory === 'all') {
                showingAll = !showingAll;
                displayImages('all');
            }
        }

        // Enhanced Centralized Lightbox Functionality
        function initLightbox() {
            // Remove existing event listeners to prevent duplicates
            const existingImages = document.querySelectorAll('.gallery-image');
            existingImages.forEach(img => {
                img.replaceWith(img.cloneNode(true));
            });
            
            const galleryImages = document.querySelectorAll('.gallery-image');
            const lightbox = document.querySelector('.lightbox');
            const lightboxImg = document.querySelector('.lightbox-img');
            const lightboxVideo = document.querySelector('.lightbox-video');
            const lightboxClose = document.querySelector('.lightbox-close');
            const lightboxPrev = document.querySelector('.lightbox-prev');
            const lightboxNext = document.querySelector('.lightbox-next');
            
            if (!galleryImages.length || !lightbox) return;
            
            let currentIndex = 0;
            const mediaItems = [];
            
            // Collect all media items (images and videos)
            galleryImages.forEach((img, index) => {
                mediaItems.push({type: 'image', src: img.src, alt: img.alt});
                
                // Add click event to open lightbox
                img.addEventListener('click', (e) => {
                    e.preventDefault();
                    currentIndex = index;
                    updateLightboxMedia();
                    lightbox.classList.add('active');
                    document.body.style.overflow = 'hidden';
                });
            });
            
            // Update lightbox media based on current index
            function updateLightboxMedia() {
                const currentItem = mediaItems[currentIndex];
                
                if (!currentItem) return;
                
                // Reset both media elements
                lightboxImg.classList.remove('active');
                if (lightboxVideo) {
                    lightboxVideo.classList.remove('active');
                    lightboxVideo.pause();
                }
                
                if (currentItem.type === 'image') {
                    lightboxImg.src = currentItem.src;
                    lightboxImg.alt = currentItem.alt;
                    lightboxImg.classList.add('active');
                } else if (currentItem.type === 'video' && lightboxVideo) {
                    lightboxVideo.src = currentItem.src;
                    lightboxVideo.classList.add('active');
                    lightboxVideo.play().catch(e => console.log("Video play error:", e));
                }
            }
            
            // Close lightbox
            if (lightboxClose) {
                lightboxClose.addEventListener('click', () => {
                    lightbox.classList.remove('active');
                    document.body.style.overflow = 'auto';
                    if (lightboxVideo) {
                        lightboxVideo.pause();
                    }
                });
            }
            
            // Navigate to previous media
            if (lightboxPrev) {
                lightboxPrev.addEventListener('click', () => {
                    currentIndex = (currentIndex - 1 + mediaItems.length) % mediaItems.length;
                    updateLightboxMedia();
                });
            }
            
            // Navigate to next media
            if (lightboxNext) {
                lightboxNext.addEventListener('click', () => {
                    currentIndex = (currentIndex + 1) % mediaItems.length;
                    updateLightboxMedia();
                });
            }
            
            // Close lightbox when clicking outside the media
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) {
                    lightbox.classList.remove('active');
                    document.body.style.overflow = 'auto';
                    if (lightboxVideo) {
                        lightboxVideo.pause();
                    }
                }
            });
            
            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (!lightbox.classList.contains('active')) return;
                
                if (e.key === 'Escape') {
                    lightbox.classList.remove('active');
                    document.body.style.overflow = 'auto';
                    if (lightboxVideo) {
                        lightboxVideo.pause();
                    }
                } else if (e.key === 'ArrowLeft') {
                    currentIndex = (currentIndex - 1 + mediaItems.length) % mediaItems.length;
                    updateLightboxMedia();
                } else if (e.key === 'ArrowRight') {
                    currentIndex = (currentIndex + 1) % mediaItems.length;
                    updateLightboxMedia();
                }
            });
        }

        // Initialize lightbox when page loads
        window.addEventListener('load', initLightbox);
    </script>
</body>
</html>
